name: nightly fetch

on:
  schedule:
    - cron: "30 22 * * *"     # 05:30 Bangkok: after the US close and FRED's daily update
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests for the rules and the page parsers
        run: python3 -m unittest fetch.test_compute fetch.test_v2 fetch.test_v4 fetch.test_watch

      - name: Fetch the feeds and write data/latest.json
        run: python3 -m fetch.fetch --out data/latest.json

      - name: Digest and push for must-reads (sends nothing unless a channel secret is set)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python3 -m fetch.notify

      - name: Commit the data files
        run: |
          git config user.name "market-watch-fetch"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/changes.json data/state.json
          if git diff --cached --quiet; then
            echo "no change in the data files"
          else
            git commit -m "data: nightly fetch $(date -u +%Y-%m-%d)"
            git push
          fi
